<template>
  <lightning-tabset variant="scoped" active-tab-value="dashboard">
    <lightning-tab label="Dashboard" value="dashboard" onactive={handleTabActive}>
      <template lwc:if={visited.dashboard}>
        <c-humanitix-setup-dashboard></c-humanitix-setup-dashboard>
      </template>
    </lightning-tab>
    <lightning-tab label="Connection" value="connection" onactive={handleTabActive}>
      <template lwc:if={visited.connection}>
        <c-humanitix-setup-connection></c-humanitix-setup-connection>
      </template>
    </lightning-tab>
    <lightning-tab label="Sync Settings" value="settings" onactive={handleTabActive}>
      <template lwc:if={visited.settings}>
        <c-humanitix-setup-sync-settings></c-humanitix-setup-sync-settings>
      </template>
    </lightning-tab>
  </lightning-tabset>
</template>
